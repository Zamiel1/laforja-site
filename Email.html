<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<base href="https://www.laforja.com.mx/">
		<title>LA FORJA</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main class="container">
		<base href="https://www.laforja.com.mx/">
			<h1 class="title">LA FORJA</h1>

			<section class="card login-card">
				<h2>Iniciar sesión</h2>
				<form id="login-form" novalidate>
					<label for="email">Inicia Sesión</label>
					<input type="email" id="email" name="email" placeholder="Correo electrónico" required />
					<div class="error" id="email-error" aria-live="polite"></div>

					<label for="password">Contraseña</label>
					<input type="password" id="password" name="password" required minlength="6" placeholder="••••••" />
					<div class="error" id="password-error" aria-live="polite"></div>
				<p class="forgot-password"><a href="https://www.laforja.com.mx/recover.html">¿Olvidaste Contraseña?</a></p>
					<button type="submit" id="login-btn">Iniciar sesión</button>
					<div class="error" id="login-error" aria-live="polite"></div>
				</form>
			</section>

			<section class="card create-card">
				<p>¿No tienes cuenta? <a id="create-account" href="https://www.laforja.com.mx/register.html">Crear cuenta</a></p>
			</section>
		</main>

		<script src="script.js"></script>
	</body>
</html>
